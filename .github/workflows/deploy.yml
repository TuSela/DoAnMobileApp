name: EngGo CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: enggo-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo code từ GitHub về máy ảo Build
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Đóng gói ứng dụng thành file JAR bằng Maven
        run: mvn clean package -Dmaven.test.skip=true
        working-directory: enggo-backend

      - name: Cấu hình AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Đăng nhập vào Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Xây dựng Docker Image và Push lên Amazon ECR
        uses: docker/build-push-action@v5
        with:
          context: ./enggo-backend
          file: ./enggo-backend/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Kết nối SSH vào EC2 và thực thi script cập nhật app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Đăng nhập vào ECR ngay trên EC2 để có quyền pull image
            aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin 291159641494.dkr.ecr.ap-northeast-1.amazonaws.com

            # 2. Chuyển đến thư mục chứa file docker-compose.yml
            cd /home/ubuntu/enggo-project

            # 3. Pull image mới nhất về và khởi chạy lại container backend (không làm gián đoạn Redis)
            docker compose pull enggo-backend
            docker compose up -d enggo-backend

            # 4. Dọn dẹp image cũ để tránh đầy ổ cứng EC2
            docker image prune -f